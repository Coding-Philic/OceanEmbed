[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanembed"
version = "0.1.0"
description = "Satellite embedding-based deep learning for 3D subsurface ocean temperature reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "OceanEmbed Team"}]

dependencies = [
    # Core ML
    "torch>=2.2.0",
    "pytorch-lightning>=2.2.0",
    "torchvision>=0.17.0",

    # Data / Ocean science
    "xarray>=2024.2.0",
    "netCDF4>=1.6.5",
    "zarr>=2.17.0",
    "dask[array]>=2024.2.0",
    "xesmf>=0.8.4",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "gsw>=3.6.16",

    # Data download
    "copernicusmarine>=1.2.4",
    "earthaccess>=0.9.0",
    "argopy>=0.1.14",
    "requests>=2.31.0",

    # Config
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",

    # Logging & experiment tracking
    "wandb>=0.16.0",
    "tensorboard>=2.16.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",

    # Visualization
    "matplotlib>=3.8.0",
    "cartopy>=0.22.0",
    "plotly>=5.19.0",
    "pyvista>=0.43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.3.0",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]
